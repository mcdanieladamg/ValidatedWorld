[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "validated-world"
version = "0.3.0.dev0"
description = "Local semantic change control for connected project knowledge"
readme = "docs/python_usage.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Adam McDaniel" }]
dependencies = []

[project.optional-dependencies]
test = ["coverage>=7,<8", "pytest>=8,<9"]

[project.scripts]
validated-world = "validated_world.cli:main"

[tool.setuptools]
package-dir = {"" = "src-python"}

[tool.setuptools.packages.find]
where = ["src-python"]

[tool.pytest.ini_options]
testpaths = ["tests-python"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["validated_world"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
