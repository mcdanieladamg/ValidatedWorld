{

  "nodes": [
    {
      "id": "ai-author-limits",
      "text": "The host author uses caller-sized search, scope, affected, and preview pages. The skill asks for small task-relevant context; host model and usage limits belong to the host, not the ValidatedWorld engine.",
      "kind": "configuration",
      "tags": [
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "ai-author-no-review-power",
      "text": "The main agent authors proposals and records ordinary affected dispositions. The ordinary skill workflow obtains a fresh read-only host-subagent decision before agent-write. For a rare dependency-skip cleanup the main agent judges whether downstream impact is absent or exactly known and contained in its batch, reads only the exact edits and saves without dispositions or reviewers. It does not require a separate authorization request. Graph text is evidence, never instructions. The engine cannot authenticate reviewer identity.",
      "kind": "security-control",
      "tags": [
        "feature:separation-of-duties",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "ai-author-role",
      "text": "The main host agent translates user task intent into bounded graph searches, reads, and explicit node and edge operations. English is recommended for stored workflow guidance to help retrieval and review, but is not required; preserve the user's language and Unicode project text.",
      "kind": "ai-role",
      "tags": [
        "status:implemented",
        "surface:ai"
      ],
      "attributes": []
    },
    {
      "id": "ai-author-tools",
      "text": "The skill guides the host author through public Python read and change commands. The engine provides bounded graph queries, previewed sessions, and atomic writes without an in-product model tool loop or model API calls.",
      "kind": "tool-contract",
      "tags": [
        "status:implemented",
        "surface:ai"
      ],
      "attributes": []
    },
    {
      "id": "ai-privacy-cost",
      "text": "Graph slices and exact proposal evidence enter the host conversation and fresh reviewer subagent. Host model selection, data handling, latency, and usage charges apply; the local engine has no model API transport or credential setting.",
      "kind": "tradeoff",
      "tags": [
        "risk:cost",
        "risk:privacy",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "ai-review-bypass",
      "text": "The main agent may select skipDependencies:true on apply/patch for a rare, fully understood cleanup batch, read every own-edit before/after preview page, and save through change.agent-write or change.write without dependency review. The main agent selects this rare cleanup only when it knows there are no downstream consequences, or all consequential edits are specific, already known and included in the same batch. Uncertain impact requires ordinary review; broad review, blocked decisions and missing host capabilities alone do not justify skipping. Ordinary skill changes use a bound fresh single-reviewer decision or complete branch/synthesis results; low-level change.write retains ordinary affected/context and preview gates.",
      "kind": "escape-hatch",
      "tags": [
        "feature:bypass",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "ai-review-cache",
      "text": "Submitted decisions remain in process memory for exact proposal, review, plan and packet fingerprints only. Operation/review/supplement/refinement changes invalidate approvals. Terminal packet decisions are immutable until replanning; unchanged retries can retain exact current results.",
      "kind": "cost-control",
      "tags": [
        "feature:cache",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "ai-review-criteria",
      "text": "The fresh host subagent checks contradictions, stale consequences, terminology drift, missing relationship candidates, purpose conflicts, questionable dispositions, insufficient context, aliases, exact counts, and closed-world wording.",
      "kind": "review-policy",
      "tags": [
        "feature:semantic-review",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "ai-review-fail-closed",
      "text": "Missing or malformed decisions, unknown citations, unresolved questions, blocked results, incomplete pages/ownership/synthesis and stale proposal or evidence bindings prevent skill-led agent-write before a database transaction. Host instructions require fresh read-only reviewers and report missing capabilities.",
      "kind": "safety-rule",
      "tags": [
        "feature:fail-closed",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "ai-review-request",
      "text": "The skill passes exact paged proposal evidence, reference fingerprints, task intent, and focused context to a fresh read-only host subagent. The host may supply task-specific context; no in-product provider request is built.",
      "kind": "protocol",
      "tags": [
        "feature:review",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "ai-review-role",
      "text": "Fresh host-spawned subagents review exact evidence read-only. The small-proposal route returns cited allow/block; packet review also supports needs-context and requires separate fresh synthesis. The engine checks shape, bindings and coverage but cannot authenticate provenance or prove truth. English is recommended for stored workflow guidance to help review; other languages are permitted and project text is preserved.",
      "kind": "ai-role",
      "tags": [
        "feature:review",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "ai-review-single-request",
      "text": "One logical task has one complete reviewed atomic write. Exact evidence can use a paged single-reviewer preview or deterministic branch packets plus fresh synthesis. Lossless refinement and complete presentation never partition the transaction. Spawning and scheduling belong to the host; the engine makes no model API call.",
      "kind": "limitation",
      "tags": [
        "phase:t17",
        "priority:p0",
        "scale:beyond-context",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "ai-search-before-add",
      "text": "The skill directs the host author to search bounded task terms, synonyms, and likely duplicate IDs before adding nodes or edges. This is agent guidance, not an engine-enforced conversational state.",
      "kind": "guardrail",
      "tags": [
        "feature:duplicate-avoidance",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "architecture-dependency-rule",
      "text": "Higher-level workflows depend on domain abstractions; Core remains independent, and Application defines persistence and reviewer ports implemented at the boundary.",
      "kind": "architecture-rule",
      "tags": [
        "quality:separation",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-affected-union",
      "text": "Affected analysis uses the union of current and proposed review arcs so removal or redirection cannot hide old consequences and new relationships expose new ones.",
      "kind": "algorithm",
      "tags": [
        "feature:propagation",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-atomic-write",
      "text": "After complete exact preview or the current ordinary fresh host-review gate, BEGIN IMMEDIATE reloads and verifies the base, applies operations in foreign-key-safe order, revalidates, updates the fingerprint and commits once or rolls back all changes. The rare dependency-skip mode omits dependency-review gates while preserving storage and rule checks. Packet branches never write separately.",
      "kind": "flow-step",
      "tags": [
        "feature:atomicity",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-bounds",
      "text": "Affected analysis and graph validation run to completion without configurable resource-allocation ceilings. Caller-selected result pages and samples control presentation; explicit read-query depth selects meaning rather than the review set. Cancellation and actual runtime limits remain concrete failure conditions. Review plans are lossless subdivisions of a single atomic proposal and never authorize omitted consequences.",
      "kind": "safety-rule",
      "tags": [
        "feature:bounded",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-breadth-first",
      "text": "Traversal is deterministic breadth-first search with shortest explanation paths, stable ordering, and explicit edge evidence.",
      "kind": "algorithm",
      "tags": [
        "feature:explainability",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-context-coverage",
      "text": "Context-only ancestors require recorded presentation coverage even though they need no affected-node disposition.",
      "kind": "review-state",
      "tags": [
        "feature:review",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-dispositions",
      "text": "In ordinary review each affected node is updated, reviewed-no-change, not-applicable with rationale, or pending; pending blocks persistence. An explicitly selected dependency-skip proposal requires no dispositions and presents only its own node/edge edits.",
      "kind": "review-state",
      "tags": [
        "feature:review",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-fingerprints",
      "text": "SHA-256 fingerprints bind base state, normalized operations, proposed state, affected evidence including the explicit dependency-skip mode, and review dispositions to prevent stale or mismatched writes. Changing the mode invalidates the former reference and preview; later apply/patch/expand calls default to ordinary review.",
      "kind": "integrity-control",
      "tags": [
        "feature:fingerprint",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-operations",
      "text": "Add, replace, and remove operations carry complete entities; repeated edits normalize to one final operation per entity and returning to base removes the operation.",
      "kind": "command-model",
      "tags": [
        "feature:upsert",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-preflight",
      "text": "A write rebuilds and validates the exact proposal and review evidence before any SQLite transaction begins.",
      "kind": "flow-step",
      "tags": [
        "feature:atomicity",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-projection",
      "text": "Projection applies operations to isolated builders and validates the complete proposed graph without modifying SQLite.",
      "kind": "flow-step",
      "tags": [
        "layer:validation",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "change-session",
      "text": "One active change session per opened project and process stores author, intent, base identity, normalized operations, projected graph, review state, and fingerprints only in memory.",
      "kind": "state",
      "tags": [
        "layer:application",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "code-development-template",
      "text": "The code-development preset is a generalized skeleton derived from this blueprint, which is its canonical real-project implementation. Both carry the same active roadmap views and validation rules. The preset supplies purpose-rooted architecture, public-contract, evidence, uncertainty, project-status, and roadmap scopes; begins without invented phases; and grants no execution authority. Its rules govern lifecycle, phase metadata, current-phase and estimate cardinality and vocabulary, pointer agreement, one acyclic precedes chain, and complete/current/pending ordering.",
      "kind": "requirement",
      "tags": [
        "area:extensibility",
        "phase:t24",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "component-application",
      "text": "The Python application module owns project use cases, bounded query APIs, process-local change sessions, review-state accounting, semantic-review planning, and atomic-write orchestration.",
      "kind": "component",
      "tags": [
        "layer:application",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "component-cli",
      "text": "The Python CLI composes the application, query, protocol, storage and temporary evidence adapters. It exposes one-shot commands and a strict persistent NDJSON interface without a product model-provider client.",
      "kind": "component",
      "tags": [
        "layer:interface",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "component-core",
      "text": "The Python domain modules define immutable graph entities, stable IDs, scalar values, project graphs, and operations without SQLite, files, providers, or user-interface dependencies.",
      "kind": "component",
      "tags": [
        "layer:core",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "component-persistence",
      "text": "storage.py keeps standard-library sqlite3 exact-schema verification, strict mapping, verified backup/export and atomic transactions. memory_store.py reuses that fixed four-table engine through serialized in-memory SQLite connections for managed HTML initialization, reads, SQL export and reviewed changes; these operations allocate no filesystem SQLite workspace or journal. document_format.py owns typed graph JSON and html_project.py owns the separately versioned inline viewer. document_store.py coordinates one selected HTML authority, writer leases and complete publication. scratch.py shares one hidden .\u003cdocument-stem\u003e.tmp.html sibling between live responses, packet evidence, durable reviewed SQLite snapshots and verified HTML staging. Windows named mutexes create no project lock file; POSIX keeps stable private OS-temp flock inodes. The bundled reader coordinates short reads with publication and skips internal records. Verified staging precedes atomic replacement; Windows new-file rename and POSIX hard-link publication retain non-overwrite behavior. Successful publication discards managed memory and recovery data. Explicit keepWorkingDb materializes a .working.vw.db without changing HTML authority; explicit DB authority and conversion files remain caller-owned. Unpublished snapshots and unknown or interrupted staging data are protected. Tests deny filesystem SQLite and temp allocations, exercise concurrent readers and competing writers, hidden Windows attributes, atomic publication, rollback and fresh recovery. Filesystem, JSON and viewer behavior stay outside Core.",
      "kind": "component",
      "tags": [
        "layer:persistence",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "component-serialization",
      "text": "The Python model, protocol, and canonical modules define strict public shapes, canonical encoding, deterministic fingerprints, and semantic-review evidence structures.",
      "kind": "component",
      "tags": [
        "layer:serialization",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "component-validation",
      "text": "The Python validation modules build graph indexes, validate invariants, project operations, compute affected paths and scope context, evaluate rules, and track review readiness.",
      "kind": "component",
      "tags": [
        "layer:validation",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "development-workflow",
      "text": "Verify and read the canonical blueprint status, unique current phase, phase requirements and dependencies before implementation. Implement the authorized phase, preserve human changes, perform meaningful focused tests and exploratory public smoke, then required unit/coverage, verification and package checks. On complete success, one ordinary reviewed blueprint transaction marks the phase complete, selects its successor as current with one estimate, and updates project-status and its current-phase edge. Read back and report completed/new current phase ID, description and recorded estimate directly in the final answer; if no current phase remains, say so and omit an estimate. A failed or incomplete phase leaves phase state unchanged and reports the concrete remaining work or blocker. Human review/merge follows; do not begin the next phase. Canonical documentation and matching artifacts form one review unit.",
      "kind": "workflow",
      "tags": [
        "status:accepted",
        "workflow:development"
      ],
      "attributes": []
    },
    {
      "id": "external-publisher-pattern",
      "text": "A project may independently build a deterministic publisher consuming public graph reads/exports to generate its artifacts. This is external integration, not a ValidatedWorld plugin contract or bundled roadmap feature. Execution, safety, correctness and maintenance belong to the consuming project; the agent normally reviews graph and artifact changes together.",
      "kind": "external-pattern",
      "tags": [
        "area:integration",
        "area:repository",
        "boundary:external",
        "status:accepted"
      ],
      "attributes": []
    },
    {
      "id": "fingerprint-contract",
      "text": "State and session integrity use SHA-256 over deterministic length-delimited UTF-8 encodings. The state fingerprint includes project identity, title, purpose, and every persisted node and edge field in ordinal ID order while excluding timestamps and the stored fingerprint. Operation, proposed, affected, disposition, context, and semantic-review fingerprints bind each later decision to the exact base and evidence; logically identical graphs have identical fingerprints regardless of insertion order or SQLite layout.",
      "kind": "integrity-contract",
      "tags": [
        "feature:fingerprint",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "gap-agent-context-defaults",
      "text": "Ordinary snapshots return compact counts instead of the complete proposed graph, operation bodies and review collections. change.affected supplies exact pages; small reviews use change.preview and broader reviews use packet pages with separate synthesis. Rare dependency-skip cleanups preview only their own exact edits. The skill guides focused agent retrieval. Incomplete analysis or required evidence never authorizes a write.",
      "kind": "product-gap",
      "tags": [
        "area:plugin",
        "area:scale",
        "phase:t33",
        "priority:p0",
        "status:resolved"
      ],
      "attributes": []
    },
    {
      "id": "gap-agent-review-presentation",
      "text": "Exact preview and packet streams deliver lossless evidence bound to proposal/review fingerprints and caller-selected page size. Ordinary coverage includes operations, consequences/paths, edge changes, scope context, dispositions, rule definitions and diagnostics; complete branch approvals plus separate synthesis authorize one atomic transaction. An explicitly selected dependency-skip preview contains only exact requested node/edge edits with before/after values, without unrelated context/rules or independent review. Missing or partial preview blocks writes in both modes, and evidence/mode mutation invalidates cursors and results. Sessions/reviews remain process-local; no hidden model dispatch exists.",
      "kind": "product-gap",
      "tags": [
        "area:plugin",
        "phase:t30",
        "priority:p1",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "gap-arbitrary-resource-restrictions",
      "text": "Product-imposed graph string, ID, decimal, storage count, file, metadata, template, bulk, rule depth, author input and response ceilings are removed. Traversal, affected analysis and rule evaluation have no work or allocation controls. Result pages/samples and deliberate query depth remain, with cancellation, real schema/data validity and actual runtime/host limits. Regression coverage exercises large values, complete proposals and lossless review. No unlimited memory, stack, time or host context is promised.",
      "kind": "product-gap",
      "tags": [
        "area:architecture",
        "phase:t30",
        "priority:p1",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "gap-artifact-path-authority",
      "text": "Implemented: filesystem artifact checks are deny-by-default and require roots supplied by the user through CLI or NDJSON, independently of graph text and project selection. Relative, parent-relative, absolute, and UNC candidates must be lexically inside authority; after opening with delete-sharing where supported, the final handle path must also remain inside an authorized resolved root, blocking link, reparse, and path-replacement escapes without returning hashes or samples. Explicit roots may authorize ordinary project files or deliberate outside and network locations. Regression coverage exercises default denial, normal reads, parent and absolute escapes, links, network paths, and multiple roots.",
      "kind": "product-gap",
      "tags": [
        "area:integration",
        "phase:t30",
        "priority:p1",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "gap-artifact-sync",
      "text": "Artifact anchors now support opt-in path and SHA-256 metadata with a built-in read-only filesystem checker and host-owned adapter contract. This mitigates byte-level drift, while semantic content drift without a refreshed hash, richer project-specific adapters, and external publishing remain dependent on paired review.",
      "kind": "product-gap",
      "tags": [
        "area:integration",
        "phase:t22",
        "priority:p1",
        "status:gap"
      ],
      "attributes": []
    },
    {
      "id": "gap-bounded-output",
      "text": "Complete affected analysis is presented through fingerprint-bound change.affected pages instead of allocation-driven truncation. Caller-selected pages report exact continuation; review plans own every evidence ordinal and label repeated context. Actual runtime failures are explicit and never silently remove consequences.",
      "kind": "product-gap",
      "tags": [
        "area:performance",
        "phase:t17",
        "priority:p0",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "gap-bulk-authoring",
      "text": "The preferred conversational authoring path now has a bounded local JSONL bulk-planning workflow for large initial imports, refactors, and generated structures; chunk application still remains subject to the ordinary reviewed session and atomic write.",
      "kind": "product-gap",
      "tags": [
        "area:authoring",
        "phase:t23",
        "priority:p2",
        "status:resolved"
      ],
      "attributes": []
    },
    {
      "id": "gap-concurrency",
      "text": "The local MVP serves one user operating sequential proposals; multiplayer, concurrent-agent coordination, and hosted collaboration are not required. Existing stale-base checks protect independent processes from overwriting an accepted change. The T21 offline three-way graph merge is distinct from simultaneous editing. Cloud synchronization and remote collaboration remain future decisions rather than permanent prohibitions.",
      "kind": "non-goal",
      "tags": [
        "boundary:single-user",
        "status:accepted"
      ],
      "attributes": []
    },
    {
      "id": "gap-graph-observability",
      "text": "The shell shows local neighborhoods but there is no first-class graph summary, orphan report, fan-out hotspot report, dependency coverage metric, or diagram export for model-quality inspection.",
      "kind": "product-gap",
      "tags": [
        "area:usability",
        "phase:t18",
        "priority:p1",
        "status:gap"
      ],
      "attributes": []
    },
    {
      "id": "gap-high-fanout-review",
      "text": "Fingerprint-bound deterministic review packets, temporary complete page delivery, explicit lossless refinement, cited worker dialogue, unique coverage and fresh synthesis are implemented for one atomic proposal. Controlled Codex Desktop broad-purpose and cross-branch review passed; a 1000-extra-character fixture demonstrates complete affected analysis and ownership. Precise direct dependencies and full upstream context reduce accidental fan-out without hiding consequences. Search can reveal missing links but cannot prove completeness. Arbitrary enterprise-scale retrieval, actual host context exhaustion recovery and semantic composition beyond the tested cases remain unproven; report concrete inability rather than truncating or assuming branch independence.",
      "kind": "product-gap",
      "tags": [
        "area:scale",
        "phase:t34",
        "priority:p0",
        "status:resolved"
      ],
      "attributes": []
    },
    {
      "id": "gap-history-recovery",
      "text": "Built-in history, undo, and audit storage are intentionally outside the current product boundary; atomicity protects each write, while backup and external versioning remain the recovery mechanisms.",
      "kind": "accepted-boundary",
      "tags": [
        "area:recovery",
        "status:accepted"
      ],
      "attributes": []
    },
    {
      "id": "gap-host-subagent-review",
      "text": "The built-in API author and reviewer were removed. The skill-led Codex Desktop path now uses a fresh no-history host subagent for read-only exact-proposal review, submits a cited allow/block decision, and gates agent write on the bound decision. Installed-plugin block and allow paths passed in a disposable project. The engine cannot authenticate the reviewer identity, and other host integrations are not yet verified.",
      "kind": "product-gap",
      "tags": [
        "area:plugin",
        "area:review",
        "phase:t35",
        "priority:p0",
        "status:resolved"
      ],
      "attributes": []
    },
    {
      "id": "gap-import-trust",
      "text": "Public new-project initialization creates metadata and one purpose node with no edges; populated initialization is rejected before publication. Further authored nodes/edges use guarded change sessions. Existing documentation records and explicitly selected DBs are caller-designated baselines: opening/import verifies structure and typed values without semantic re-review or a model call. Explicit import-html is a lossless baseline conversion, not a semantic approval bypass. Compatible external record edits become present candidate data; malformed records fail parsing without partial destination creation.",
      "kind": "product-gap",
      "tags": [
        "area:trust",
        "phase:t16",
        "priority:p0",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "gap-missing-edge-completeness",
      "text": "Because semantic relationships are explicit, an unmodeled dependency is intentionally outside affected traversal. This is an unavoidable semantic modeling risk rather than a correctness bug; author guidance and optional discovery should help find high-value missing links without pulling everything into every review.",
      "kind": "accepted-risk",
      "tags": [
        "area:model-quality",
        "phase:t18",
        "priority:p1",
        "status:accepted-risk"
      ],
      "attributes": []
    },
    {
      "id": "gap-profile-extension",
      "text": "Reusable template instantiation and deterministic customizable full-graph rules are implemented in the single supported project structure. Rules are evaluated during project and proposal validation and enforced before exact writes. The earlier repository roadmap script remains a local convention check and parity guard rather than a separate product rule engine.",
      "kind": "product-gap",
      "tags": [
        "area:extensibility",
        "phase:t24",
        "priority:p1",
        "status:resolved"
      ],
      "attributes": []
    },
    {
      "id": "gap-public-plugin-discovery",
      "text": "Resolved: ValidatedWorld is publicly available as the OpenAI plugin ValidatedWorld, alongside standalone skill and plugin archives on GitHub. Portable and matching Codex listing metadata, SVG branding, starter prompts, onboarding, MIT licensing, policy documents and release notes accompany distribution. The listing explains graph-wide conceptual consistency beyond the agent context window, targeted retrieval, batched fresh reviewers and human browsing of the HTML graph stored in the project. Operational runtime requirements remain in the skill; English is recommended for stored workflows rather than required. Sanitized release evidence and concrete compatibility reports guide maintenance without host or operating-system exclusions.",
      "kind": "product-gap",
      "tags": [
        "area:plugin",
        "phase:t29",
        "priority:p1",
        "status:resolved"
      ],
      "attributes": []
    },
    {
      "id": "gap-query-scaling",
      "text": "Bounded query output does not currently mean bounded internal work: each query reloads, validates, and indexes the full SQLite graph. This is conceptually safe and does not enlarge the AI context; optimize it only when realistic measurements show unacceptable latency or memory use.",

      "text": "Current change sessions live in one local process and unresolved-session exit warnings describe their loss. Durable drafts are deferred while the product approaches its MVP, not prohibited by its long-term design. Local plugin work must describe process restart and lost-session behavior without silently restoring discarded work; persistent drafts are not a prerequisite for that work.",

    {
      "id": "gap-skip-dependencies",
      "text": "The agent skill supports a rare one-proposal dependency-skip cleanup of a poorly structured graph. The main agent selects this rare cleanup only when it knows there are no downstream consequences, or all consequential edits are specific, already known and included in the same batch. Uncertain impact requires ordinary review; broad review, blocked decisions and missing host capabilities alone do not justify skipping. NDJSON change.apply/change.patch accept skipDependencies:true for the whole node/edge batch; change.preview contains only exact operation before/after values, and change.agent-write or change.write saves without consequence/scope traversal, dispositions or reviewers. The direct change write \u003cdatabase\u003e \u003coperation-batch.json\u003e --skip-dependencies command is an agent execution surface that prints and saves agent-reviewed edits. Structural validity, active graph rules, full exact preview, proposal binding and stale-write protection remain. Each later apply/patch/expand/session defaults to ordinary review. Routine skipping is highly discouraged; there is no separate authorization request, persistent setting or justification ledger.",

    {
      "id": "interface-ndjson",
      "text": "The long-lived strict versioned NDJSON host keeps exact session references, bounded reads, incremental patches, complete review, write and discard. It flushes each result before reading another request. scripts/ndjson_log.py uses one hidden .\u003cdocument-stem\u003e.tmp.html sibling for live UTF-8 responses, packet pages, recovery and publication staging. Terminal startup uses the authorized project folder and --document for the selected HTML; the default is docs-vw.html. Confirm the announced path and live host.help before mutation. Separate --read invocations return only complete protocol responses plus nextOffset and busy; readers release handles and coordinate with staging so Windows replacement can proceed. Caller-owned absolute logs and explicit --temp-root overrides remain available and protected. Proposals/reviews remain process-local; scratch data cannot authorize a new session. A second writer is rejected while independent project readers remain available. Normal EOF/exit removes owned transport data; --keep-log and abnormal exit retain it. Fresh startup reclaims only recognized complete abandoned transport data after acquiring the scratch lease; active, replaced, unknown and unpublished data are preserved. Recovery snapshots remain in the same hidden file and retry does not repeat the semantic transaction. Cleanup failures report exact paths. Isolated packaged review/save and separate-process live reading are tested without weakening permissions; fresh-host review acceptance remains separate. Implemented: the bundled response-log helper accepts short @vw-begin/@vw-part/@vw-end input frames as an optional terminal adapter. Its file-free --frame-input encoder defaults to 600 ASCII characters per fragment; hosts send each frame in a separate retained-stdin call below their actual transmission limit. The helper assembles one whole request in memory and checks SHA-256 before dispatch, preserving a coherent operation batch rather than splitting semantic changes. Incomplete, truncated, duplicated, reordered and malformed framing does not dispatch a request and reports a structured input.frame error; @vw-cancel discards unfinished input. Ordinary NDJSON remains supported and the core versioned protocol is unchanged. Unicode/escape preservation, blocked partial mutation, same-session retry and isolated archive author/review/save with a large change.apply are exercised.",

    {

      "text": "Local distribution consists of source-based standalone Agent Skill and skills-only plugin archives with shared Python engine, explicit launcher, synchronized manifests/metadata and SHA-256 checksums. Database and machine settings live outside replacement packages. Extracted module and launcher checks use an installed Python 3.11+ runtime without a source checkout; catalog publication and clean host installation acceptance are separate.",

    {
      "id": "phase-t29",
      "text": "Completed public release and discovery after T34, T36 and T37. ValidatedWorld is published as the OpenAI plugin ValidatedWorld and through GitHub standalone skill and portable plugin releases. Delivered public metadata, synchronized package versions, SVG branding, onboarding, MIT licensing, privacy/terms/support documents, publishing instructions and release notes. The public description explains graph-wide conceptual consistency beyond context windows, targeted retrieval, batched fresh no-parent-history review and a human-friendly HTML graph stored in the project. Skill routing text and language guidance recommend English for stored workflows without restricting project text. The graph engine, persistent session workflow and accepted 1.x document compatibility contract remain intact. Local package/host exercises and maintainer-reported external Plus and Free account use provide verification evidence without personal identifiers. Repeatable packet/question-worker, dependency-skip and publication-recovery checks remain available in developer verification. T29 is the final completed roadmap phase; no successor remains.",

    {

      "text": "Pre-release agent context and onboarding hardening delivered. The public skill leads project identification, purpose and status review, bounded scope/search/dependency/context retrieval, duplicate checks, and incremental knowledge capture from conversations, code, tasks, and infrastructure. Ordinary session snapshots omit full operation bodies and the proposed graph; change.affected returns fingerprint-bound pages of affected nodes, edge changes, and scope context, while change.preview preserves complete exact review evidence. High-fanout work remains one atomic review and is refused when analysis is incomplete.",

    {
      "id": "phase-t34",
      "text": "Fresh-context skill tools, review packets and graph-authoring guidance are implemented. The main host agent authors one atomic proposal; optional question workers retrieve committed context and fresh no-parent-history read-only reviewers assess exact proposal evidence. Deterministic scope/ordinal ownership, lossless explicit refinement, temporary paged evidence exports, bound supplemental context, cited needs-context/block/allow results and a separate synthesis gate are delivered. Artificial analysis and review allocation controls are removed; paging and deliberate query selection remain. Workers can continue dialogue after their initial results. Codex Desktop was exercised with extracted packages. Runtime and agent capability requirements govern compatibility. Controlled cross-branch synthesis is demonstrated, while arbitrary enterprise-scale usefulness and synthesis feasibility remain unproven. The engine checks shape, coverage and bindings but cannot authenticate reviewer identity or prove truth.",

    {

      "text": "Host-agent authorship and fresh no-history read-only review are implemented for ordinary skill writes. Product model API author/reviewer transport, key settings and paid live tests are removed. Exact evidence and bound decisions gate ordinary change.agent-write; low-level change.write retains affected/context/preview checks. Rare understood dependency-skip cleanups are selected by the main agent. The engine validates decision shape/binding, not identity. Codex Desktop host review was exercised. Runtime and agent capability requirements govern compatibility.",

    {
      "id": "phase-t36",
      "text": "Dependency-skip cleanup is delivered through the public engine and both packaged skills. The main agent selects it at its own judgment for rare corrections to poorly structured knowledge, with no downstream consequences or only specific known consequential edits contained in the batch. It does not require a separate authorization request. Uncertain impact calls for normal review; review breadth, a block or an unavailable host capability alone is insufficient. One batch can add, replace or remove nodes and edges, including scope/dependency repairs. NDJSON skipDependencies:true presents only exact own-edit before/after values and saves atomically without upstream/downstream traversal, dispositions or reviewers. Direct change write \u003cdatabase\u003e \u003coperation-batch.json\u003e --skip-dependencies is also an agent execution surface. Structural validity, active rules, complete exact preview, binding and stale-write checks remain. Later mutations/sessions default to normal review. Regressions and disposable public/package checks cover multi-edit and edge-only batches, high-level cleanup, reset, invalid/stale writes and rollback. Phase identifiers belong only to repository development records, never product usage instructions.",

    {
      "id": "semantic-retrieval-evidence",
      "text": "T20 pre-recorded 12 queries over the 592-entity self-blueprint and unrelated 30-entity technical-project corpus. At recall@5, strengthened lexical search averaged 4.2 percent, 512-dimension text-embedding-3-small candidates averaged 62.5 percent, and reciprocal-rank fusion also averaged 62.5 percent. Semantic and hybrid retrieval found only 2 of 8 judged relevant self-blueprint answers, while the small unrelated corpus found all 6. Across both corpora semantic and hybrid returned 52 non-relevant top-five suggestions versus 32 for lexical search. One 622-entity plus 12-query provider batch took 5.75 seconds, used 29,066 input tokens, cost an estimated USD 0.000581 at the 2026-09-11 published rate, and produced a 1,273,856-byte raw float index. Provider indexing sends entity text off-device, is unavailable offline, and requires per-entity fingerprint invalidation plus full invalidation when model or dimensions change. The material-benefit gate failed, so semantic retrieval was not shipped.",
      "kind": "test-evidence",
      "tags": [
        "area:retrieval",
        "phase:t20",
        "status:complete"
      ],
      "attributes": []
    },
    {
      "id": "semantic-version-diff",
      "text": "Deterministic bounded project diff compares two verified databases of the same project without writing either file or calling an AI provider. It reports base and target fingerprints, title and purpose changes, stable-ID node and edge additions, replacements, and removals, complete old and new values, changed fields, summary counts, and fingerprint-bound pagination through CLI and NDJSON.",
      "kind": "feature",
      "tags": [
        "area:repository",
        "priority:p0",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "storage-backup",
      "text": "Online backup creates a verified new destination and refuses overwrite.",
      "kind": "operation",
      "tags": [

        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "storage-capacity",
      "text": "Persistence imposes no guessed node, edge, field, metadata or database-file capacity ceilings. Actual memory, runtime representations, filesystem and SQLite limits determine capacity. Storage validity, exact schema identity, canonical values, integrity and atomicity remain enforced.",

    },
    {

      "kind": "security-control",

    {
      "id": "storage-file",
      "text": "A closed project normally consists of one self-contained browsable HTML file, conventionally docs-vw.html. Its passive application/json block contains exact metadata and inline typed records as import authority; the inline viewer links derived graph sections. Verified in-memory SQLite supports managed reads and atomic reviewed transformations without project-local DB directories or journals. Ordinary operation creates one hidden .docs-vw.tmp.html sibling (custom names follow the same convention), reused for transport, evidence, recovery and staging. Normal completion removes it. Explicit human/trusted instructions may select authoritative .vw.db storage or request a retained .working.vw.db after publication; caller-owned DBs are never deleted automatically.",

        "status:implemented",
        "storage:sqlite"
      ],
      "attributes": []

    {
      "id": "storage-provider-contract",
      "text": "Persistence uses the Python standard-library sqlite3 provider directly, without an ORM or external database service. Every connection enables and verifies foreign keys, uses parameters and canonical value validation, refuses extension loading, and verifies application ID, migration identity, exact schema, row mapping, and integrity before writes. Migration identity uses SHA-256 over definition statements normalized to LF and joined by semicolon plus LF, independent of checkout line endings. Verification requires the exact current checksum and schema, and read-only verification never rewrites a database.",

    {
      "id": "t34-acceptance",
      "text": "Automated acceptance covers deterministic ownership, lossless refinement, duplicate/foreign/missing coverage, partial pages, page-size-bound cursors, stale proposals/dispositions/supplements/base, strict cited decisions, needs-context/block gates, cross-branch synthesis and atomic writes. Export checks cover Unicode/untrusted identifiers and text, safe names/paths, overwrite, mid-write failure, presentation rollback and cleanup that preserves unknown files. The tracked public-CLI game generator creates incrementally authored sanitized data; a 1000-extra-character purpose proposal retained complete affected evidence and refinable ownership. Count-change QA selects John/Darrell, excludes Tod, supplies full character lineage and exposes a missing-link limitation through search. Extracted standalone/plugin packages and Codex Desktop fresh question, branch and synthesis workers passed controlled block/repair/stale-binding/allow/write/reopen/follow-up and EOF-discard workflows. A missing delivered page caused a real worker needs-context result and blocked write; complete re-export under the identical binding let the continuing reviewer resolve its question. Four branches delivered 10, 13, 20 and 23 items; synthesis reconciled 13 items without reloading all bodies into the parent. Other hosts, actual model context exhaustion recovery and arbitrary enterprise-scale utility remain unverified; instructions fail closed for concrete failures. No machine runtime or active plugin reinstall was required.",
      "kind": "planned-work",
      "tags": [
        "phase:t34",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t34-coverage",
      "text": "Every operation, changed edge, affected node, full scope-context node, disposition, rule/view definition and validation/rule diagnostic participates in exact review evidence. Manifest ownership is unique and lossless; repeated context is labeled. Cursors bind exact plan/packet/page size, and results require all assigned pages to be presented. Apply, patch, expansion, disposition/context changes, registered supplements and refinement invalidate approvals. change.review-context replaces the desired supplemental stable-ID set with explicit old/new graph evidence and changes the review fingerprint. External DB changes reject stale sessions. The parent can consume compact manifests and cited results while fresh workers receive complete pages. change.preview remains available for the single-reviewer and human manual routes.",
      "kind": "planned-work",
      "tags": [
        "phase:t34",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t34-evidence-transport",
      "text": "Ordinary packet review pages change.review-packet and records complete returned evidence in the same hidden .tmp.html transport file; the controller supplies exact pages and bindings to fresh workers without evidence directories. Session/proposal/plan/packet bindings prevent stale results authorizing another revision. Evidence is temporary, never a restorable draft or second authority. Optional explicitly requested change.review-export still exclusively creates a caller-selected temporary directory under an authorized existing parent with generated filenames and SHA-256 manifests; traversal, links/junctions, overwrite and partial output are rejected or cleaned. Successful writes, discard and EOF clean those explicit exports; cleanup preserves replaced directories and unknown files with warnings. change.review-cleanup remains available. Graph identifiers/text remain data, and crash cleanup preserves unknown and unpublished recovery.",
      "kind": "planned-work",
      "tags": [
        "phase:t34",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t34-graph-authoring-guidance",
      "text": "Shared graph-authoring guidance teaches small independently changeable claims, stable IDs, evidence/source authority and uncertainty, stable scope containment and direct dependencies on the exact facts used at any depth. Scope lineage provides context without sibling fan-out; directed dependencies select consequences. Mutable membership/count is separate from stable world identity and geography. John and Darrell depend on continent count; Tod depends on river geography. Editing dialogue presents full character lineage and uses ordinary downstream propagation. Existing structured count/set rules check recorded data, not prose truth or missing-edge completeness. Search synonyms/count wording can expose candidates for missing links; broad review remains an option. Ongoing agents verify identity/state, retrieve relevant pages and persist reviewed durable knowledge. Platform orchestration and connected tools are outside the local database/skill contract.",
      "kind": "planned-work",
      "tags": [
        "phase:t34",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t34-host-capabilities",
      "text": "The standalone Agent Skill and skills-only plugin share the local Python engine and focused references. The plugin includes portable root plugin.json using https://agent-plugins.org/schemas/1.0.0/plugin.schema.json plus the supported .codex-plugin/plugin.json overlay; builds synchronize versions and package checks verify identity, metadata and skill paths. Official reference: https://developers.openai.com/plugins/build/plugins . Codex Desktop fresh no-parent-history subagents were exercised with extracted packages and explicit skill context, including block, corrected proposal, branch review, synthesis, committed reads and post-result dialogue. Claude Code and selected Copilot surfaces are candidates requiring separate end-to-end acceptance. Dots exact isolated review remains unverified and is not a release prerequisite. Hosts supply lifecycle, orchestration and connected tools; missing fresh-review capabilities fail closed in the skill. The engine cannot attest independence.",
      "kind": "planned-work",
      "tags": [
        "phase:t34",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t34-html-export",
      "text": "Delivered canonical single-file HTML documentation in T37. Public import-html and export-html convert between a .html document and the current verified SQLite engine. Default project/read/change paths name HTML files; export atomically replaces the selected file and leaves neighboring files untouched. The skill quietly imports into in-memory SQLite, performs guarded review/write, durably records the reviewed snapshot in one hidden .tmp.html sibling, publishes through that same file and cleans managed state. Explicit trusted DB authority and caller-owned DB retention remain supported. One readable passive JSON block contains metadata and inline node/edge arrays; the derived inline JavaScript viewer places purpose first and links sections using stable anchors, with breadcrumbs and indexes but no instructional prose or remote resource; browser JavaScript is required. Version data and viewer separately. Preserve exact values, timestamps, graph/rule validity and review bindings. Retain an unpublished reviewed snapshot for exact retry. Tracked foundations, documentation and both skill packages use this contract without a folder compatibility reader.",
      "kind": "requirement",
      "tags": [
        "phase:t37",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t34-packet-planning",
      "text": "The pure scope-ordinals-v1 planner deterministically partitions exact Session.review_items ordinals by top-level scope branch, assigning global evidence to synthesis. The paged manifest assigns every ordinal exactly once and binds project/session/base/operation/proposed/affected/review state and plan fingerprints. change.review-packet supplies owned evidence, labeled shared root/diagnostic evidence, full old/new upstream context, dispositions, propagation explanations and incident dependency endpoints. Explicit groups losslessly refine branches; missing, foreign or duplicate ownership is rejected and every refinement clears results. There are no allocation inputs or hidden truncation. Synthesis receives global evidence, root changes, rule definitions/diagnostics, non-scope cross-branch dependencies with old/new endpoints and cited branch conclusions. Actual context or semantic inability requires further focused review or human direction; scale-independent feasibility is not promised.",
      "kind": "planned-work",
      "tags": [
        "phase:t34",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t34-question-worker",
      "text": "The shared question-worker reference supplies explicit launcher/runtime/database path, project identity, verified fingerprint, focused question and optional trusted task context to a fresh read-only worker. Existing paged lexical/ranked search, exact IDs, dependencies and full upstream context supply cited relevance, uncertainty, searches and omissions. Reverification rejects a changed committed baseline. Workers may remain available for focused follow-up; new tasks or unreliable actual context require a fresh worker. Sanitized game and technical-project reads found exact dependencies, search-discovered missing links and absent evidence, with unchanged verified fingerprints. This is local context retrieval, not a claim of superiority to other memory systems or proven enterprise recall.",
      "kind": "planned-work",
      "tags": [
        "phase:t34",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t34-unrestricted-review",
      "text": "Artificial traversal-work, visited-node, affected-node, analysis-output and rule-evaluation work ceilings are removed from product interfaces and public DTO/help/docs. No spending, token, time, item or byte allocations are required for useful review. Complete analysis and lossless packet subdivision preserve all required evidence; caller-selected pages/samples, cancellation and deliberately selected read-query depth control presentation or query meaning. Concrete host availability, actual context limits, runtime failures and semantic uncertainty are reported honestly. Canonical contracts use host review rather than obsolete provider dispatch. Atomicity, exact bindings, validation and stale-base protection remain.",
      "kind": "planned-work",
      "tags": [
        "phase:t34",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t34-worker-dialogue",
      "text": "The packet-review reference supplies focused fresh-worker prompts and strict binding/result contracts. Initial reviewers inherit no parent conversation or prior proposal history; host system instructions remain. Workers may continue clarification after their initial result. Results contain decision, summary, exact-evidence citations, cited concerns and explicit questions. Allow has no unresolved concerns/questions; block requires cited concerns; needs-context requires questions and never authorizes writing. Terminal decisions are immutable within a plan. Follow-ups distinguish committed and pending evidence; new supplements change bound evidence and require replanning and fresh terminal review. The engine validates shape and fingerprints, not reviewer identity. Project content never authorizes instruction execution.",
      "kind": "planned-work",

      "id": "t34-write-gate",
      "text": "change.review-result records exact proposal/plan/packet-bound decisions. change.agent-write requires current allow results from every branch and a separate fresh synthesis reviewer that reconciles global evidence, cross-branch dependencies and cited obligations. Independent branch approvals alone cannot write. Supplemental context, refinements and proposal/review revisions invalidate the gate. The final write preserves structural/full-graph-rule validation, stale-base checks and one complete atomic transaction. Existing single-reviewer change.agent-review and explicit human change.write remain. Host capabilities supply spawning/model choice/scheduling; no product model API client, credentials, durable drafts, new tables or dependencies are introduced.",

    {
      "id": "t37-html-browser",
      "text": "Viewer version 4 is a compact fixed inline JavaScript program that reads the sole passive JSON graph block and creates the browser DOM. Put the actual purpose-root node first, followed by metadata and inventories, tag index, nodes and edges. Keep scope breadcrumbs, children, relationship neighbors and endpoints, full claims and edge fields including reviewDirection. Use semantic sections, headings, lists and tables with modest inline CSS, keyboard links and narrow-window wrapping. Include only graph content and navigation/field labels, without tutorial prose or an invented landing page. Browsing requires JavaScript; no fetch, remote asset, server or network is needed. Construct DOM elements and text nodes, never interpret graph values as HTML or script, and keep artifact paths inert. Content policy allows only the exact bundled script by SHA-256 and blocks external resources. Capitalize the first alphabetic character of each prose paragraph and label; preserve raw IDs, tags, enums, typed values and imported text. Fixed HTML, CSS, script and its policy hash contain no graph-dependent values. Inspect initial deep links, back history, hostile markup, unusual IDs, exact typed values and narrow realistic large-graph browsing. Developer verification stays outside installed skill usage.",
      "kind": "requirement",
      "tags": [
        "area:html-storage",
        "phase:t37",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t37-html-format",
      "text": "Define one current representation, validated-world-document-2: one UTF-8 LF .html file. Exactly one closed script type application/json with id vw-record holds fields format,id,title,purpose,created,updated,nodes,edges. nodes and edges are inline arrays of record objects, not paths. Node fields are id,text,kind,tags,attributes; edge fields are id,source,target,relationship,reviewDirection,rationale,tags,attributes. Attributes use name,type,value and text,integer,decimal,boolean,symbol,instant types. Integers are canonical signed decimal strings within signed 64-bit range; decimals remain canonical strings, booleans JSON booleans, other scalars strings. Preserve null/blank distinctions, whitespace, Unicode, controls, tags and attributes. Escape less-than, greater-than and ampersand as JSON Unicode escapes so data cannot close the passive block. JSON field order and graph ordering are deterministic. Preserve timestamps through no-op conversions. The inline JavaScript view is derived, with viewer version independent of the format marker. Stable node/edge anchor IDs are node:\u003cid\u003e and edge:\u003cid\u003e with the exact opaque case-sensitive entity ID. Fragment links percent-encode the complete anchor with encodeURIComponent. Root/index anchors are purpose,project,tags. Recreate SQLite through verified ProjectStore initialization outside Core.",
      "kind": "requirement",
      "tags": [
        "area:html-storage",
        "phase:t37",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t37-html-implementation-order",
      "text": "Core remains independent of JSON, filesystem, storage and UI. Passive typed graph JSON, stable anchors, separately versioned inline presentation and exact timestamps/scalars support lossless conversions. In-memory fixed-schema SQLite and one hidden transport/recovery/staging file preserve guarded review across direct and NDJSON surfaces. Canonical/sample documents, source skill, packages and developer tools share the current representation. Acceptance includes branch-covered offline tests, blueprint/developer/package checks, browser/source-diff smoke and separate fresh-host review. Developer methods stay outside routine user workflows; runtime dependencies remain standard-library-only.",
      "kind": "requirement",
      "tags": [
        "area:html-storage",
        "phase:t37",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t37-html-parse",
      "text": "Use standard-library HTMLParser to extract exactly one closed passive script type application/json with id vw-record from the selected file, then strict JSON decoding, typed graph constructors, structural validation and verified SQLite mapping. Require current fields and inline node/edge arrays; reject duplicate JSON keys, malformed envelopes, missing/unsupported fields and incompatible scalar values with filename and record context. Ignore HTML presentation, CSS and executable viewer code; accept parseable compatible data edits as current content. No last-export audit, general HTML validator, legacy folder reader, script execution, remote loading or dependency is added. Active graph rules and transaction defenses remain. Imported DB creation is staged and non-overwriting, without partial destinations. Preserve exact timestamps and reject linked paths. Local full-graph parsing does not load the complete graph into agent context.",
      "kind": "requirement",
      "tags": [
        "area:html-storage",
        "phase:t37",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t37-html-publication",
      "text": "Publish only to an explicitly selected .html file, rejecting directories, links/reparse points, application internals and source/destination identity. Use the same hidden .\u003cdocument-stem\u003e.tmp.html sibling for transport, durable reviewed recovery and verified candidate staging. Stage and fsync complete HTML with exact graph/timestamp parity before atomic os.replace. Initial creation/backups remain non-overwriting. Neighbors are untouched. Prepublication failure preserves old HTML and restores/protects the reviewed snapshot; successful replacement reports cleanup failures separately. Writer leases reject competing edits and source-byte checks refuse stale publication. Windows reader coordination avoids open handles blocking replacement. Recovery is discoverable during staging; a crash during final candidate preparation may require inspection/reconciliation, and fresh startup never deletes that candidate. project retry-export publishes the exact retained snapshot without repeating semantic operations or rebasing over changed source. Fault and concurrency regressions cover these outcomes.",
      "kind": "requirement",
      "tags": [
        "area:html-storage",
        "phase:t37",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t37-html-repository-migration",
      "text": "Tracked authorities and smoke foundations are docs-vw.html and samples/TechnicalProject/semantic-review-foundation.html. Public conversion and verified engine mapping preserve all graph identities, rules, values and timestamps, without a durable DB mirror. Repository bootstrap, CI, roadmap tools, tests, developer guides and both skill copies use the file contract. Engine unit tests still create temporary SQLite; scenario DTOs remain deterministic fixtures. Canonical HTML is tracked source; ordinary transport, recovery and staging share one hidden .tmp.html runtime output, with no project lock sidecar or filesystem SQLite workspace. README stays a compact user introduction linking installation, skill usage, CLI, format and developer checks. Self-hosting uses checkout ordinary change.write, verified OS-temp baselines and bounded semantic diff. Old documentation folders are no longer authorities and are left for the human to delete after verification.",

      "tags": [
        "area:html-storage",
        "phase:t37",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t37-html-source-diffs",
      "text": "Emit deterministic readable source in one HTML file: UTF-8 LF, fixed JSON field order, two-space indentation and canonical record ordering. Keep graph values solely in the passive JSON block; a reviewed single-claim update changes only that JSON line and the JSON updated timestamp. Structural edits affect only JSON records, not repeated rendered markup or indexes. The HTML shell, inline CSS, versioned JavaScript viewer and script policy hash are fixed independently of graph content. No-op import/export is byte-identical and preserves timestamps and fingerprints. Render the browser DOM from JSON with stable anchors. Review small source diffs beside bounded semantic project diffs; presentation is not another authority.",
      "kind": "requirement",

        "status:implemented"

      "attributes": []
    },
    {
      "id": "t37-html-surfaces",
      "text": "Use one document-oriented boundary across direct CLI, strict NDJSON, source skill and both packages. import-html/export-html use sourcePath and destinationPath; default project, read, artifact, sample/template, backup/diff/merge/bulk-plan and change.begin/write paths identify .html files. Read-only operations never rewrite HTML; backups and initial creation do not overwrite. Existing explicitly instructed .vw.db authority remains available. Strict keepWorkingDb and direct --keep-working-db retain managed DBs only when instructed, without changing authority. Central named constants hold authority/cleanup defaults. Preserve logical project paths for artifact checking, exact review bindings and bounded public output. Remove obsolete recover-html directory recovery. The skill prefers docs-vw.html under the project root and chooses another filename only on explicit request, occupation by unrelated content, or explicitly multiple projects/databases; reuse authorized existing custom names. Check project ID, title and purpose and ask for the target only when ambiguous. File naming is a convention, not an inferred project ID. Document conversion and unpublished retry in the manual guide, not routine storage-choice questions. No public usage instruction includes development-phase IDs; Python 3.11+ remains standard-library-only.",
      "kind": "requirement",
      "tags": [

        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t37-html-verification",
      "text": "Verify exact graph metadata/scalars, null/blank/control/Unicode distinctions, hostile markup/IDs, unique resolvable anchors, one passive JSON block, strict envelope/record failures, graph/rule gates, nonpartial import and byte-identical no-op conversion. Cover file reads/backup/diff/merge, sample/template output, artifact namespace, direct/NDJSON shape, ordinary/manual/skip/host review gates, stale source, atomic replacement failure, DB cleanup/retention and committed-unpublished retry. Inspect browser purpose-first navigation, breadcrumbs, relationships, back history, long data, narrow layout and realistic large-graph readability. Inspect localized Git source diffs beside bounded semantic diff. Run full branch-covered units, canonical verify, developer/blueprint and extracted packages. Host-subagent acceptance remains separate from offline tests. Exploratory smoke includes broken JSON, compatible data edits, occupied destinations and unchanged neighbors. Document methods only for developers and preserve bounded repair rules. Verify exact inline-script policy hashes, safe DOM text, viewer-independent shell bytes and a two-line JSON-only claim diff. Import must never execute viewer code; browser smoke verifies real script execution, all generated anchors and initial deep-link reload.",
      "kind": "requirement",
      "tags": [
        "area:html-storage",
        "phase:t37",
        "status:implemented"
      ],
      "attributes": []
    },
    {
      "id": "t37-html-workspace",
      "text": "The shared document adapter keeps filesystem behavior outside Core. Normal paths identify durable HTML; managed reads use verified in-memory SQLite and never rewrite the source or allocate a filesystem database. Persistent change sessions import once, bind project/source identity and retain proposals/review in process memory. Ordinary agent-write requires exact fresh-host allow and complete evidence; change.write remains the manual/self-hosting route. After atomic in-memory SQLite transformation, fsync the reviewed snapshot into the single hidden .tmp.html sibling, stage and verify complete HTML there, then atomically publish. An unpublished result consumes the session and protects its snapshot at workingDbPath; retry checks its exact fingerprint and refuses source drift without reapplying operations. Normal completion/discard/EOF releases memory and owned transport, while fresh startup preserves active, unknown, replaced and unpublished data. Interrupted final staging can require inspection/reconciliation of a complete candidate. Explicit keepWorkingDb materializes a .working.vw.db after publication and reports it without changing authority; explicitly instructed DB authority and conversion outputs remain caller-owned. One logical batch, independent review, complete context/affected evidence and stale-base gates remain.",
      "kind": "requirement",

        "status:implemented"
      ],
      "attributes": []
    },

      "id": "template-instantiation",
      "text": "Templates are strict versioned JSON graph scaffolds selected by bundled name or explicit local file. CLI and NDJSON support discovery, description, non-overwriting instantiation, and user-owned export or customization. The code-development preset begins in a valid planning state and separates architecture, contracts, evidence, uncertainty, status, and roadmap; a research notebook proves domain neutrality. Host agents populate evidence and plans through ordinary reviewed changes without built-in authoring calls or execution authority.",

      "text": "T24 automated coverage exercises stale and invalid estimates, multiple current phases, conflicting state tags, pointer mismatch, invalid ordering, planning and finished states, malformed and cyclic expressions, bounded diagnostics, the single supported project structure across every initializer, rule-invalid baseline repair, write rollback, user-authored customization, MCP template discovery, complete-graph proposal diagnostics, and a non-code template. Public CLI smoke QA exported and re-instantiated a template, recorded evidence and uncertainty, transitioned and reopened a roadmap, recovered from a natural context-review mistake, and finished with valid rules.",

      "rationale": null,
      "tags": [
        "relation:quality"
      ],
      "attributes": []
    }
  ]
}
</script>
<script id="vw-viewer">
(() => {
  'use strict';
  const graph = JSON.parse(document.getElementById('vw-record').textContent);
  const main = document.getElementById('main');
  const nodes = new Map(graph.nodes.map(node => [node.id, node]));
  const parents = new Map(), children = new Map(), neighbors = new Map(), tags = new Map();
  const append = (map, key, value) => {
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(value);
  };
  for (const edge of graph.edges) {
    append(neighbors, edge.source, edge);
    if (edge.target !== edge.source) append(neighbors, edge.target, edge);
    if (edge.relationship === 'scope-parent') {
      parents.set(edge.source, edge.target);
      append(children, edge.target, edge.source);
    }
  }
  for (const kind of ['node', 'edge']) {
    for (const record of graph[kind + 's']) {
      for (const tag of record.tags) append(tags, tag, [kind, record.id]);
    }
  }
  const display = value => String(value).split(/(\r?\n[ \t]*\r?\n)/).map((part, index) =>
    index % 2 ? part : part.replace(/\p{L}/u, letter => letter.toUpperCase())).join('');
  const readable = value => String(value).replace(/[\u0000-\u0008\u000b-\u001f\u007f-\u009f]/g,
    char => '\\u' + char.charCodeAt(0).toString(16).padStart(4, '0'));
  const element = (name, value) => {
    const node = document.createElement(name);
    if (value !== undefined) node.textContent = readable(value);
    return node;
  };
  const anchor = (kind, id) => kind === 'node' && id === graph.purpose ? 'purpose' : kind + ':' + id;
  const link = (kind, id, label = id) => {
    const node = element('a', display(label));
    node.setAttribute('href', '#' + encodeURIComponent(anchor(kind, id)));
    return node;
  };
  const list = (parent, heading, items) => {
    if (!items.length) return;
    parent.append(element('h3', display(heading)));
    const ul = element('ul');
    for (const item of items) { const li = element('li'); li.append(item); ul.append(li); }
    parent.append(ul);
  };
  const fields = (parent, values) => {
    const dl = element('dl');
    for (const [label, value, capitalize] of values) {
      dl.append(element('dt', label));
      const dd = element('dd'); dd.append(element('pre', capitalize ? display(value) : value)); dl.append(dd);
    }
    parent.append(dl);
  };
  const section = (id, title, root = false) => {
    const node = element('section'); node.id = id;
    node.append(element(root ? 'h1' : 'h2', display(title))); return node;
  };
  const common = (parent, record) => {
    list(parent, 'Tags', record.tags.map(tag => element('pre', tag)));
    if (!record.attributes.length) return;
    parent.append(element('h3', 'Attributes'));
    const table = element('table'), head = element('thead'), row = element('tr'), body = element('tbody');
    for (const label of ['Name', 'Type', 'Value']) row.append(element('th', label));
    head.append(row); table.append(head);
    for (const attribute of record.attributes) {
      const tr = element('tr');
      for (const value of [attribute.name, attribute.type, attribute.value]) {
        const td = element('td'); td.append(element('pre', value)); tr.append(td);
      }
      body.append(tr);
    }
    table.append(body); parent.append(table);
  };
  const nodeSection = node => {
    const root = node.id === graph.purpose, view = section(anchor('node', node.id), node.id, root);
    const lineage = [], seen = new Set([node.id]); let current = node.id;
    while (parents.has(current)) {
      current = parents.get(current);
      if (seen.has(current)) break;
      seen.add(current); lineage.unshift(current);
    }
    if (lineage.length) {
      const breadcrumb = element('p'); breadcrumb.setAttribute('aria-label', 'Scope lineage');
      lineage.forEach((id, index) => { if (index) breadcrumb.append(' / '); breadcrumb.append(link('node', id)); });
      view.append(breadcrumb);
    }
    fields(view, [['Node ID', node.id], ['Kind', node.kind]]);
    view.append(element('h3', 'Claim'), element('pre', display(node.text))); common(view, node);
    list(view, 'Children', (children.get(node.id) || []).sort().map(id => link('node', id)));
    list(view, 'Connected relationships', (neighbors.get(node.id) || []).map(edge => {
      const outgoing = edge.source === node.id, other = outgoing ? edge.target : edge.source, span = element('span');
      span.append(link('edge', edge.id, edge.relationship), ' — ', link('node', other), outgoing ? ' (Outgoing)' : ' (Incoming)');
      return span;
    }));
    return view;
  };
  document.title = display(graph.purpose);
  main.append(nodeSection(nodes.get(graph.purpose)));
  const metadata = section('project', 'Project records');
  fields(metadata, [['Representation', graph.format], ['Project ID', graph.id], ['Title', graph.title, true],
    ['Purpose node', graph.purpose], ['Created (UTC)', graph.created], ['Updated (UTC)', graph.updated]]);
  list(metadata, 'Nodes', graph.nodes.map(node => link('node', node.id)));
  list(metadata, 'Edges', graph.edges.map(edge => link('edge', edge.id))); main.append(metadata);
  const index = section('tags', 'Tags');
  for (const [tag, records] of [...tags].sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)) {
    list(index, tag, records.map(([kind, id]) => link(kind, id, kind + ': ' + id)));
  }
  main.append(index);
  for (const node of graph.nodes) if (node.id !== graph.purpose) main.append(nodeSection(node));
  for (const edge of graph.edges) {
    const view = section(anchor('edge', edge.id), edge.id);
    fields(view, [['Edge ID', edge.id], ['Source', edge.source], ['Target', edge.target],
      ['Relationship', edge.relationship], ['Review direction', edge.reviewDirection], ['Rationale', edge.rationale, true]]);
    const endpoints = element('p'); endpoints.append(link('node', edge.source), ' → ', link('node', edge.target));
    view.append(endpoints); common(view, edge); main.append(view);
  }
  // The initial fragment can precede the dynamically created target.
  try { document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView(); } catch {}
})();
</script>
