name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore ValidatedWorld.slnx
      - run: dotnet build ValidatedWorld.slnx --no-restore

      - run: >
          dotnet test ValidatedWorld.slnx
          --no-build
          --no-restore
          --filter "Category!=LiveOpenAI"
          --logger "trx;LogFileName=test-results.trx"

      - shell: pwsh
        run: ./eng/Test-DeveloperTools.ps1
      - shell: pwsh
        run: ./eng/Test-Blueprint.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 3
