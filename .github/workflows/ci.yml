name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Resolve platform test policy
    runs-on: ubuntu-latest
    outputs:
      run_windows: ${{ steps.policy.outputs.run_windows }}
      run_linux: ${{ steps.policy.outputs.run_linux }}
      run_macos: ${{ steps.policy.outputs.run_macos }}
      all_skipped: ${{ steps.policy.outputs.all_skipped }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: policy
        env:
          VW_CI_SKIP_WINDOWS: ${{ secrets.VW_CI_SKIP_WINDOWS }}
          VW_CI_SKIP_LINUX: ${{ secrets.VW_CI_SKIP_LINUX }}
          VW_CI_SKIP_MACOS: ${{ secrets.VW_CI_SKIP_MACOS }}
        run: python eng/python_ci_config.py --github-output "$GITHUB_OUTPUT"

  windows:
    name: Python Windows tests
    needs: configure
    if: needs.configure.outputs.run_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m coverage run --branch -m unittest discover -s tests-python -v
      - run: python -m coverage report
      - run: python -m validated_world project verify ValidatedWorld.Blueprint.vw.db
      - shell: pwsh
        run: |
          .\eng\Build-PythonPackage.ps1 -Version 0.3.0-dev
          .\eng\Test-PythonPackage.ps1 -PackagesDirectory artifacts/python-release/0.3.0-dev

  linux:
    name: Python Linux tests
    needs: configure
    if: needs.configure.outputs.run_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m coverage run --branch -m unittest discover -s tests-python -v
      - run: python -m coverage report
      - run: python -m validated_world project verify ValidatedWorld.Blueprint.vw.db
      - shell: pwsh
        run: |
          ./eng/Build-PythonPackage.ps1 -Version 0.3.0-dev
          ./eng/Test-PythonPackage.ps1 -PackagesDirectory artifacts/python-release/0.3.0-dev

  macos:
    name: Python macOS tests
    needs: configure
    if: needs.configure.outputs.run_macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m coverage run --branch -m unittest discover -s tests-python -v
      - run: python -m coverage report
      - run: python -m validated_world project verify ValidatedWorld.Blueprint.vw.db
      - shell: pwsh
        run: |
          ./eng/Build-PythonPackage.ps1 -Version 0.3.0-dev
          ./eng/Test-PythonPackage.ps1 -PackagesDirectory artifacts/python-release/0.3.0-dev

  aggregate:
    name: Python platform aggregate
    needs: [configure, windows, linux, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check enabled platform jobs
        env:
          CONFIGURE_RESULT: ${{ needs.configure.result }}
          RUN_WINDOWS: ${{ needs.configure.outputs.run_windows }}
          RUN_LINUX: ${{ needs.configure.outputs.run_linux }}
          RUN_MACOS: ${{ needs.configure.outputs.run_macos }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          ALL_SKIPPED: ${{ needs.configure.outputs.all_skipped }}
        run: python eng/python_ci_config.py --check-aggregate
